
{% extends "base.html" %}

{% block title %}{{ building.name }}{% endblock title %}

{% block content %}
{% include "extensions/buttons.html" %}

<div class="container mt-4">
    <div class="accordion" id="unitAccordion">

        <div class="accordion-item">
            <h2 class="accordion-header">
                <button
                    class="accordion-button"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#unitDescription"
                    aria-expanded="true"
                    aria-controls="unitDescription"
                >
                    {{ building.name }}
                </button>
            </h2>

            <div
                id="unitDescription"
                class="accordion-collapse collapse show"
            >
                <div class="accordion-body">
                    Описание здания {{ building.name }}.
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header">
                <button
                    class="accordion-button collapsed"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#unitCharacteristics"
                    aria-expanded="false"
                    aria-controls="unitCharacteristics"
                >
                    Характеристики
                </button>
            </h2>

            <div
                id="unitCharacteristics"
                class="accordion-collapse collapse"
            >
                <div class="accordion-body">
                    Характеристики здания.
                </div>
            </div>
        </div>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock content %}
