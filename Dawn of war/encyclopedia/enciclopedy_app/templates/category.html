{% extends "base.html" %}
{% block title %} Разделы {{ current.name }} {% endblock title %}
{% block content %}
{% include "extensions/buttons.html" %}<br><br>
<div class="container">
<div class="card-group">
  <div class="card">
    <img src="{{ url_for('static', filename=current.icon) }}" class="card-img-top" alt="...">
    <div class="card-body">
         <a href="{{ url_for('race', race_id=current.id) }}">
      <h5 class="card-title">UNITS</h5>
     </a>
    </div>
  </div>
  <div class="card">
    <img src="{{ url_for('static', filename=current.vechicle_icon) }}" class="card-img-top" alt="...">
    <div class="card-body">
        <a href="{{ url_for('vehicle', race_id=current.id) }}">
      <h5 class="card-title">VEHICLE</h5>
      </a>
    </div>
  </div>
  <div class="card">
    <img src="{{ url_for('static', filename=current.build_icon) }}" class="card-img-top" alt="...">
    <div class="card-body">
        <a href="{{ url_for('buildings', race_id=current.id) }}">
      <h5 class="card-title">BUILDINGS</h5>
      </a>
    </div>
  </div>
</div>
</div>
{% endblock content %}
