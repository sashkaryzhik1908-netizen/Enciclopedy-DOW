<div class="container">
    <nav class="nav">
        {% for race in races %}
            {% if current and current.id == race.id %}
                <a class="nav-link active fw-bold text-primary"
                   href="{{ url_for('category', race_id=race.id) }}">
                    <h5> {{ race.name }} </h5>
                </a>
            {% else %}
                <a class="nav-link"
                   href="{{ url_for('category', race_id=race.id) }}">
                    <h5> {{ race.name }} </h5>
                </a>
            {% endif %}
        {% endfor %}
    </nav>
</div>
