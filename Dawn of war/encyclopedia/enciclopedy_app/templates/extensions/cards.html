<div class="col-md-6 col-lg-4 mb-3">
  <div class="card border-info h-100">
    <div class="row g-0">

      {% if object.icon %}
      <div class="col-md-4">
        <div class="ratio ratio-1x1">
          <img
            src="{{ url_for('static', filename=object.icon) }}"
            class="w-100 h-100 object-fit-contain rounded-start"
            alt="{{ object.name }}"
          >
        </div>
      </div>
      {% endif %}

      <div class="{% if object.icon %}col-md-8{% else %}col-12{% endif %}">
        <div class="card-body">

          <p class="card-text">
            <small class="text-body-secondary">
              {{ object.race.name }}
            </small>
          </p>

          <h5 class="card-title">
            <a href="{{ url_for(detail_endpoint,
                            race_id=object.race_id,
                            object_id=object.id) }}">
              {{ object.name }}
            </a>
          </h5>

          <p class="card-text">
            Описание объекта.
          </p>

        </div>
      </div>

    </div>
  </div>
</div>
